a{color:inherit}
.num,.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* En-tête */
header.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;border-bottom:3px solid var(--red)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none;cursor:pointer}
.brand svg{width:40px;height:40px}
.brand b{display:block;font:800 21px/1 var(--f-d);font-stretch:78%;letter-spacing:.04em}
.brand b em{font-style:normal;color:var(--gold2)}
.brand small{display:block;font:500 10.5px/1.3 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:#A9B8D3;margin-top:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#C4CEE0;padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
nav.tabs button.on{background:#fff;color:var(--navy)}
.tools{display:flex;gap:8px;flex:none}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.14)}
.ibtn svg{width:18px;height:18px}
.hs{position:relative}
.hs input{width:210px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;padding:0 12px;font-size:13.5px;outline:none}
.hs input::placeholder{color:#A9B8D3}
.hs input:focus{border-color:#D9B26A;background:rgba(255,255,255,.12)}
.hres{position:absolute;right:0;top:44px;width:300px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:6px;display:none;z-index:60}
.hres a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;text-decoration:none}
.hres a:hover,.hres a.on{background:var(--chip)}
.hres a small{display:block;color:var(--ink3);font-size:11.5px}
.hres a b{margin-left:auto;font:600 12.5px var(--f-m)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0A1628;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:300;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:linear-gradient(135deg,#0A1F44,#13305F);color:#fff;border-radius:18px;padding:30px 34px;overflow:hidden;position:relative}
.banner h3{color:#fff;font:800 30px/1.08 var(--f-d);font-stretch:85%;margin:8px 0 10px}
.banner p{color:#C9D3E6;margin:0}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.minis div{aspect-ratio:16/9;border-radius:8px;background:#F6F7FA;position:relative;overflow:hidden;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.minis div:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.minis div i{position:absolute;left:12%;right:10%;height:7%;border-radius:3px;background:#CDD3DD}
.minis div i:nth-child(1){top:16%;width:55%;height:10%;background:#0A1628}
.minis div i:nth-child(2){top:38%;height:38%;width:36%;background:var(--c);opacity:.8}
.minis div i:nth-child(3){top:38%;left:54%;height:38%;width:36%}

main{padding:28px 0 60px;min-height:70vh}
.page{display:none;animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Titres de section */
.eyebrow{font:700 11.5px/1 var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
h1,h2,h3{margin:0;font-family:var(--f-d);color:var(--ink)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 22px;flex-wrap:wrap}
.ph h2{font:800 34px/1.05 var(--f-d);font-stretch:82%;letter-spacing:-.01em;margin-top:8px}
.ph p{margin:8px 0 0;color:var(--ink2);max-width:680px}
.serif{font-family:var(--f-s);font-weight:400;font-style:italic;letter-spacing:0}
h3.ct{font:700 16px/1.25 var(--f-d);margin:0 0 3px}
.cs{color:var(--ink3);font-size:13px;margin:0 0 14px}

/* Cartes et grilles */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.g{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:18px}.mt2{margin-top:28px}
.src{margin-top:12px;font-size:11.5px;color:var(--ink3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font:800 27px/1.1 var(--f-d);font-stretch:85%;margin-top:6px;white-space:nowrap}
.kpi .v small{font-size:15px;font-weight:700;color:var(--ink2);margin-left:2px}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.up{color:var(--pos)}.dn{color:var(--neg)}

/* Héros */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--navy);color:#fff;padding:44px 44px 40px;display:grid;grid-template-columns:1.25fr 1fr;gap:36px;box-shadow:0 20px 50px rgba(10,31,68,.25)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 88% -10%,rgba(200,16,46,.35),transparent 42%),
  radial-gradient(circle at 70% 120%,rgba(180,133,58,.25),transparent 45%);pointer-events:none}
.hero .diamond{position:absolute;right:-120px;top:-60px;width:520px;opacity:.07;pointer-events:none}
.hero>*{position:relative}
.hero .eyebrow{color:var(--gold2)}
.hero h1{color:#fff;font:800 58px/.98 var(--f-d);font-stretch:78%;letter-spacing:-.015em;margin:14px 0 16px}
.hero h1 .serif{font-size:1.08em;color:var(--gold2)}
.hero p.lead{color:#C9D3E6;font-size:17px;max-width:560px;margin:0}
.cta{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 18px;font-weight:700;border:1px solid transparent;cursor:pointer;text-decoration:none;font-size:14.5px}
.btn.p{background:var(--red);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.btn.o{background:var(--card);border-color:var(--line2);color:var(--ink)}
.btn.o:hover{border-color:var(--ink3)}
.podium{display:grid;gap:10px;align-content:center}
.pod{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;cursor:pointer;transition:.2s}
.pod:hover{background:rgba(255,255,255,.12)}
.pod .rk{font:800 30px/1 var(--f-d);font-stretch:75%;color:var(--gold2);width:28px}
.pod .t{flex:1;min-width:0}
.pod .t b{display:block;font-size:16px}
.pod .t span{font-size:12.5px;color:#A9B8D3}
.pod .val{font:800 26px/1 var(--f-d);font-stretch:80%}
.pod .val small{font-size:13px;color:#A9B8D3;font-weight:600}

/* Logos */
.lg{display:inline-block;width:34px;height:34px;flex:none;background-color:#fff;background-position:center;background-size:78%;background-repeat:no-repeat;border-radius:9px;border:1px solid var(--line)}
:root[data-theme="dark"] .lg{border-color:transparent}
.lg.s{width:26px;height:26px;border-radius:7px}
.lg.l{width:56px;height:56px;border-radius:14px}
.lg.xl{width:86px;height:86px;border-radius:20px;background-size:74%}
.hero .lg,.fhead .lg{border-color:transparent}

/* Mur de logos */
.wall{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.wall button{background:var(--card);border:1px solid var(--line);border-radius:12px;aspect-ratio:1;padding:10px;cursor:pointer;transition:.18s;display:grid;place-items:center}
.wall button:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
.wall button i{width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}
:root[data-theme="dark"] .wall button{background:#fff}

/* Listes classées */
.rows{display:grid;gap:2px}
.row{display:grid;grid-template-columns:30px 26px 1fr auto;align-items:center;gap:10px;padding:7px 6px;border-radius:9px;cursor:pointer}
.row:hover{background:var(--chip)}
.row .rk{font:700 13px var(--f-m);color:var(--ink3);text-align:right}
.row .nm{font-weight:600;font-size:14px;min-width:0}
.row .nm .b{height:6px;border-radius:4px;margin-top:5px;background:var(--navy)}
:root[data-theme="dark"] .row .nm .b{background:var(--al)}
.row .vv{font:600 13.5px var(--f-m);text-align:right}
.more{margin-top:10px;width:100%;background:var(--chip);border:0;border-radius:10px;padding:9px;font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer}
.more:hover{color:var(--ink)}

/* Signaux */
.sig{position:relative;padding-left:18px}
.sig:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:3px;background:var(--red)}
.sig.gold:before{background:var(--gold)}.sig.navy:before{background:var(--al)}
.sig .big{font:800 34px/1 var(--f-d);font-stretch:80%;margin:6px 0}
.sig p{margin:4px 0 0;color:var(--ink2);font-size:13.5px}

/* Tableau */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.srch{flex:1;min-width:180px;max-width:280px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
table.t th{position:sticky;top:0;background:var(--bg2);text-align:right;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:10px 7px;white-space:nowrap;cursor:pointer;user-select:none}
table.t th.l,table.t td.l{text-align:left}
table.t th.on{color:var(--red)}
table.t td{padding:8px 7px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-m);font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:-.03em}
table.t td.l{font-family:var(--f-d);font-size:14px}
table.t tr:hover td{background:var(--chip);cursor:pointer}
.tn{display:flex;align-items:center;gap:10px;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font:700 10.5px/1.6 var(--f-d);letter-spacing:.06em;text-transform:uppercase}
.pill.al{background:rgba(30,79,160,.12);color:var(--al)}.pill.nl{background:rgba(200,16,46,.1);color:var(--nl)}
.tier{font:700 10.5px var(--f-d);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tier.t1{background:#0A1F44;color:#F3D48E}.tier.t2{background:#B4853A;color:#fff}.tier.t3{background:var(--chip);color:var(--ink)}.tier.t4{background:transparent;color:var(--ink3);border:1px solid var(--line2)}
.score{display:inline-flex;align-items:center;gap:7px}
.score i{display:inline-block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--red))}

/* Cartes franchises */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.fc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;overflow:hidden;transition:.18s;box-shadow:var(--shadow)}
.fc:hover{transform:translateY(-3px);border-color:var(--line2)}
.fc:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.fc .top{display:flex;gap:12px;align-items:center;padding-right:26px}
.fc .rk{position:absolute;right:14px;top:12px;font:800 22px/1 var(--f-d);font-stretch:75%;color:var(--line2)}
.fc b{display:block;font-size:15px;line-height:1.2}
.fc span{font-size:12px;color:var(--ink3)}
.fc .v{font:800 26px/1 var(--f-d);font-stretch:82%;margin-top:14px}
.fc .v small{font-size:13px;color:var(--ink3);font-weight:600}
.fc .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:8px}

/* Fiche (tiroir) */
.ov{position:fixed;inset:0;background:rgba(6,11,22,.55);backdrop-filter:blur(3px);z-index:80;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:90;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.fhead{position:relative;color:#fff;padding:28px 28px 24px;background:var(--c);overflow:hidden}
.fhead:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.fhead>*{position:relative;z-index:1}
.fhead .x{position:absolute;right:16px;top:16px;z-index:2}
.fhead .id{display:flex;gap:18px;align-items:center}
.fhead h2{color:#fff;font:800 32px/1.05 var(--f-d);font-stretch:80%}
.fhead p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:14px}
.fhead .nav{display:flex;gap:8px;margin-top:18px}
.fbody{padding:22px 28px 40px}
.k6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k6 .kpi .v{font-size:24px}

/* Graphiques */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f-d)}
.chart svg{fill:var(--ink2)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .ax0{stroke:var(--line2);stroke-width:1}
svg .lbl{font-size:12px;fill:var(--ink)}
svg .val{font:600 11.5px var(--f-m);fill:var(--ink)}
svg .mut{fill:var(--ink3);font-size:11px}
.tip{position:fixed;z-index:200;pointer-events:none;background:#0A1628;color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .12s;max-width:280px}
.tip b{font-size:13.5px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:4px 10px 4px 5px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chips button .lg{width:20px;height:20px;border-radius:50%}
.chips button.on{border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c)}

/* Simulateur */
.sim label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
.sim label span{float:right;font-family:var(--f-m);color:var(--ink)}
.sim input[type=range]{width:100%;accent-color:var(--red)}
.sim select{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res .kpi .v{font-size:25px}
.note{font-size:12.5px;color:var(--ink2);background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:12px}

/* Duel */
.duel{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:0;align-items:center}
.dh{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.dh select{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 10px;font-weight:700;max-width:100%}
.vs{font:800 44px/1 var(--f-s);font-style:italic;text-align:center;color:var(--gold)}
.dr{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);align-items:center;gap:0;padding:9px 0;border-top:1px solid var(--line)}
.dr .m{text-align:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.dr .a,.dr .b{display:flex;align-items:center;gap:8px;font:600 14px var(--f-m)}
.dr .a{justify-content:flex-end;text-align:right}
.dr .a i,.dr .b i{height:8px;border-radius:4px;display:inline-block;min-width:2px}
.dr .w{color:var(--ink);font-weight:800}
.dr .ls{color:var(--ink3)}

/* Carte */
.map svg .st{fill:var(--bg2);stroke:var(--card);stroke-width:.8}
.map svg .oth{fill:var(--bg);stroke:var(--line2);stroke-width:.5}
.map svg .sea{fill:transparent}

/* Méthode */
.prose{max-width:820px}
.prose h3{margin:26px 0 8px;font-size:19px}
.prose p,.prose li{color:var(--ink2)}
.prose b{color:var(--ink)}

/* Pied */
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--ink3);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* ======== RAPPORT ======== */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:6px 0 20px}
.rtitle{font:900 64px/.95 var(--f-d);font-stretch:74%;letter-spacing:-.01em;text-transform:uppercase;margin:12px 0 0;color:var(--ink)}
.rmeta{color:var(--ink2);font-size:15px;margin:0 0 6px}
.rbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rbar .grp{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:var(--shadow);flex:none}
.rbar .grp button{border:0;background:none;padding:10px 14px;border-radius:10px;font:600 15.5px var(--f-d);color:var(--ink);cursor:pointer;white-space:nowrap}
.rbar .grp button:hover{background:var(--chip)}
.rbar .grp button.pdf{color:var(--red)}
.rbar .pos{flex:1;text-align:center;font:500 15px/1.4 var(--f-m);letter-spacing:.02em;color:var(--ink2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtoc-ov{position:fixed;inset:0;background:rgba(6,11,22,.45);z-index:84;display:none}
.rtoc-ov.on{display:block}
.rtoc{position:fixed;left:0;top:0;bottom:0;width:min(360px,92vw);background:var(--card);border-right:1px solid var(--line);z-index:85;overflow:auto;padding:14px 12px 30px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 60px rgba(0,0,0,.2)}
.rtoc.on{transform:none}
.rtoc-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:18px}
.rtoc-h button{border:0;background:var(--chip);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--ink)}
.rtoc .ch{font:700 10.5px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;margin:16px 8px 6px;color:var(--c)}
.rtoc a{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 8px;border-radius:9px;font-size:13.5px;line-height:1.35;color:var(--ink2);cursor:pointer;text-decoration:none}
.rtoc a span{font:500 11px/1.7 var(--f-m);color:var(--ink3)}
.rtoc a:hover{background:var(--chip);color:var(--ink)}
.rtoc a.on{background:var(--ink);color:var(--bg)}
.rtoc a.on span{color:var(--bg)}

});

pr('cons');pr('rev');pr('eb');pr('chg');pr('wp');pr('ws');

const MOUNTS = [];
function mount(el,fn,ratio=.56){

  for(let i=MOUNTS.length-1;i>=0;i--) if(!MOUNTS[i].el.isConnected) MOUNTS.splice(i,1);

/* ---------- CLASSEMENT ---------- */
PAGES.classement=el=>{
  const S={key:'cons',dir:-1,f:'all',q:'',all:false};
  const COLS=[['rk','#',0],['nom','Franchise',1],['cons','Consensus'],['fb','Forbes'],['cn','CNBC'],['sp','Sportico'],['spread','Écart'],['chg','1 an'],['rev','Revenus'],['eb','EBITDA'],['mult','Multiple'],['cnDebt','Dette'],['elite','Indice'],['tier','Palier']];
  el.innerHTML=head('Classement 2026','Les 30 franchises, <span class="serif">trois regards</span>','Valeur consensus (moyenne des trois sources), écart entre estimations, comptes 2025 et indice Elite. Touchez un en-tête pour trier, une ligne pour ouvrir la fiche.',`<button class="btn o" id="csv">Télécharger le CSV</button>`)+
  `<div class="tbar"><div class="seg" id="cf">${[['all','Toutes'],['AL','Américaine'],['NL','Nationale'],['Est','Est'],['Centrale','Centrale'],['Ouest','Ouest']].map(([k,l],i)=>`<button data-f="${k}" class="${i?'':'on'}">${l}</button>`).join('')}</div><input class="srch" id="cq" placeholder="Rechercher une franchise, un propriétaire…"></div>
  <div class="tw"><table class="t" id="ct"></table></div>
  <div class="g g2 mt">${card('Trois sources, trois valeurs','Chaque point est une estimation : <b style="color:#0A1F44">Forbes</b>, <b style="color:#2E7DD7">CNBC</b>, <b style="color:#B4853A">Sportico</b>. La barre grise mesure l\'écart.','<div class="chart" id="c-db"></div>')}
  ${card('Indice Elite sur 100','40 % valeur, 20 % revenus, 15 % EBITDA, 10 % croissance, 15 % sportif (victoires 2025 et titres).','<div class="chart" id="c-el"></div>'+more('c-el',30))}</div>`;
  const tb=$('#ct');
  function render(){
    let rows=T.filter(t=>(S.f==='all'||t.lg===S.f||t.div===S.f)&&(!S.q||(t.nom+' '+t.owner+' '+t.ville+' '+t.stade).toLowerCase().includes(S.q)));
    rows.sort((a,b)=>{ const k=S.key==='rk'?'cons':S.key; const va=a[k],vb=b[k]; return typeof va==='string'?S.dir*va.localeCompare(vb):S.dir*((S.key==='rk'||S.key==='tier')?-(va-vb):(va-vb)); });
    const shown=S.all||S.f!=='all'||S.q?rows:rows.slice(0,12);
    tb.innerHTML=`<thead><tr>${COLS.map(([k,l,left])=>`<th data-k="${k}" class="${left?'l':''} ${S.key===k?'on':''}">${l}${S.key===k?(S.dir<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead><tbody>${shown.map(t=>`<tr data-id="${t.id}">
      <td>${t.rk}</td><td class="l"><span class="tn">${lg(t.id,'s')}${t.nom} <span class="pill ${t.lg.toLowerCase()}">${t.lg}</span></span></td>
      <td><b>${md(t.cons)}</b></td><td>${md(t.fb)}</td><td>${md(t.cn)}</td><td>${md(t.sp)}</td><td>${pct(t.spread,0,false)}</td>
      <td class="${t.chg>=0?'up':'dn'}">${pct(t.chg,0)}</td><td>${md(t.rev)}</td><td class="${t.eb<0?'dn':''}">${md(t.eb)}</td><td>${x1(t.mult)}</td><td>${pct(t.cnDebt,0,false)}</td>
      <td><span class="score"><i style="width:${t.elite*.3}px"></i>${NF1.format(t.elite)}</span></td><td>${tierH(t)}</td></tr>`).join('')}</tbody>`;
    const m=$('#cmore'); if(m) m.remove();
    if(shown.length<rows.length) tb.parentElement.insertAdjacentHTML('afterend',`<button class="more" id="cmore">Afficher les ${rows.length}</button>`);
    $$('th',tb).forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(S.key===k) S.dir*=-1; else {S.key=k;S.dir=(k==='nom'||k==='rk')?1:-1;} render(); });
    const mb=$('#cmore'); if(mb) mb.onclick=()=>{S.all=true;render();};
  }
  $$('#cf button').forEach(b=>b.onclick=()=>{ $$('#cf button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); S.f=b.dataset.f; render(); });
  $('#cq').oninput=e=>{ S.q=e.target.value.trim().toLowerCase(); render(); };
  $('#csv').onclick=()=>{
    const h=['Rang','Franchise','Ligue','Division','Consensus (M$)','Forbes (M$)','CNBC (M$)','Sportico (M$)','Variation 1 an (%)','Revenus 2025 (M$)','EBITDA 2025 (M$)','Multiple','Dette (% valeur)','Masse salariale 2025 (M$)','Victoires 2025','Titres','Indice Elite','Propriétaire'];
    const r=byCons.map(t=>[t.rk,t.nom,t.lg,t.div,Math.round(t.cons),t.fb,t.cn,t.sp,t.chg.toFixed(1),Math.round(t.rev),t.eb,t.mult.toFixed(2),t.cnDebt,t.pay,t.w,t.ws,t.elite.toFixed(1),t.owner]);
    const csv='﻿'+[h,...r].map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='mlb-elite-2026.csv'; a.click();
  };
  render();
  mount('#c-db',dumbbell(byCons),1.25);
  const el2=[...byElite]; let n=12;
  const f=()=>hbars(el2.slice(0,n).map(t=>({id:t.id,label:t.court,v:t.elite,c:t.c1,tip:`<b>${t.nom}</b><br>Indice Elite : ${NF1.format(t.elite)} / 100<br>Valeur ${NF0.format(t._cons)} · Revenus ${NF0.format(t._rev)} · EBITDA ${NF0.format(t._eb)}<br>Croissance ${NF0.format(t._chg)} · Sportif ${NF0.format(t.sport)}`})),{fmt:v=>NF1.format(v),max:100,rowH:28});
  mount('#c-el',f(),12*28/600);
  $('[data-more="c-el"]').onclick=e=>{ n=30; const m=$('#c-el')._m; m.fn=f(); m.ratio=30*28/600; m.el.innerHTML=''; mount(m.el,m.fn,m.ratio); e.target.remove(); };
};

function fiche(id){
  const t=BY[id]; const i=byCons.indexOf(t); const prev=byCons[(i+29)%30], next=byCons[(i+1)%30];
  const own = t.buyY && t.buyY<2026 ? `Acquise ${md(t.buyP)} en ${t.buyY}, la franchise vaut aujourd'hui ${md(t.cons)} : ${NF1.format(t.ownX)} fois la mise, soit ${pct(t.own*100,1,false)} par an.` : t.buyY===2026?`Rachetée ${md(t.buyP)} en 2026, record de la ligue pour une vente conclue.`:'';
  const extra = (X.notes||{})[id]||'';
  $('#drawer').innerHTML=`<div class="fhead" style="--c:${t.c1};background:${t.c1}">
    <button class="ibtn x" id="dx" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="id">${lg(t.id,'xl')}<div><div class="eyebrow" style="color:rgba(255,255,255,.8)">N° ${t.rk} · ${TIERS[t.tier]} · ${t.lgName}, ${t.div}</div><h2>${t.nom}</h2><p>${t.owner} · depuis ${t.since}</p><p>${t.stade} · ${t.ville}</p></div></div>
    <div class="nav"><button class="btn g" data-id="${prev.id}">‹ ${prev.court}</button><button class="btn g" data-id="${next.id}">${next.court} ›</button></div></div>
  <div class="fbody">
    <div class="k6">
      ${kpi('Valeur consensus',big(t.cons),`<span class="${t.chg>=0?'up':'dn'}">${pct(t.chg,0)}</span> sur un an`)}
      ${kpi('Revenus 2025',big(t.rev),`${x1(t.mult)} de multiple`)}
      ${kpi('EBITDA 2025',big(t.eb),'Estimation CNBC',t.eb<0?'dn':'')}
      ${kpi('Masse salariale',big(t.pay),`${NF0.format(t.payRev)} % des revenus`)}
      ${kpi('Bilan 2025',`${t.w}-${t.l}`,t.post)}
      ${kpi('Indice Elite',NF1.format(t.elite),`${t.erk}<sup>e</sup> sur 30`)}
    </div>
    ${own||extra?`<div class="note" style="margin-top:14px">${[own,extra].filter(Boolean).join(' ')}</div>`:''}
    <div class="card mt"><h3 class="ct">Valeur Forbes depuis 2015</h3><p class="cs">De ${md(t.hist[0])} à ${md(t.hist[11])} : ${pct(t.cagr*100,1,false)} par an en moyenne.</p><div class="chart" id="d-h"></div></div>
    <div class="g g2 mt">
      ${card('Les trois estimations','Mars 2026',`<div class="chart" id="d-s"></div>`)}
      ${card('Carte d\'identité','',`<table class="t" style="font-size:13px"><tbody>
        <tr><td class="l">Fondation</td><td>${t.founded}</td></tr><tr><td class="l">Titres (World Series)</td><td>${t.ws}${t.lastWs?' · dernier en '+t.lastWs:''}</td></tr>
        <tr><td class="l">Stade</td><td>${t.opened} · ${int(t.cap)} pl.</td></tr><tr><td class="l">Affluence 2025</td><td>${int(t.att)}</td></tr>
        <tr><td class="l">Saison 2026</td><td>${t.w26}-${t.l26}${t.dv26?' · champion de division':t.cl26?' · qualifié':''}</td></tr><tr><td class="l">Dette</td><td>${pct(t.cnDebt,0,false)} · ${md(t.debt)}</td></tr><tr><td class="l">Projection 2030</td><td>${md(t.p2030)}</td></tr></tbody></table>`)}
    </div>
  </div>`;
  $('#drawer').classList.add('on'); $('#ov').classList.add('on'); $('#drawer').scrollTop=0;
  mount('#d-h',lines([{name:t.nom,c:t.c1==='#27251F'||t.c1==='#2F241D'?t.c2:t.c1,area:true,pts:YEARS.map((y,k)=>[y,t.hist[k]])}],{fmt:md,yfmt:v=>NF1.format(v/1000),xevery:2}),.42);
  mount('#d-s',hbars([{label:'Forbes',v:t.fb,c:C.fb},{label:'CNBC',v:t.cn,c:C.cn},{label:'Sportico',v:t.sp,c:C.sp}],{logo:false,labelW:70,rowH:34,max:Math.max(t.fb,t.cn,t.sp)*1.15}),.4);
  $('#dx').onclick=closeF;
}

  const expand=(id,list,mk,rh=26)=>{ let n=12; const g=()=>hbars(list.slice(0,n).map(mk),{rowH:rh,...(list._o||{})});
    mount('#'+id,g(),12*rh/560); const b=$(`[data-more="${id}"]`); if(b) b.onclick=()=>{ n=30; const m=$('#'+id)._m; m.fn=g(); m.ratio=30*rh/560; m.el.innerHTML=m.fn(m.el.clientWidth,Math.round(m.el.clientWidth*m.ratio)); b.remove(); }; };
  const mu=[...T].sort((a,b)=>b.mult-a.mult); mu._o={fmt:x1};
  expand('f-mu',mu,t=>({id:t.id,label:t.court,v:t.mult,c:lgc(t),tip:`<b>${t.nom}</b><br>${x1(t.mult)} les revenus<br>Valeur ${md(t.cons)} · revenus ${md(t.rev)}`}));
  const eb=[...T].sort((a,b)=>b.eb-a.eb);
  expand('f-eb',eb,t=>({id:t.id,label:t.court,v:t.eb,c:t.eb<0?'var(--neg)':'var(--pos)',tip:`<b>${t.nom}</b><br>EBITDA CNBC : ${md(t.eb)}<br>Résultat Forbes : ${md(t.oi)}<br>Masse salariale : ${md(t.pay)}`}));
  const de=[...T].sort((a,b)=>b.debt-a.debt);
  expand('f-de',de,t=>({id:t.id,label:t.court,v:t.debt,c:t.cnDebt>=20?'var(--red)':'var(--bar)',tip:`<b>${t.nom}</b><br>Dette : ${md(t.debt)}<br>${pct(t.cnDebt,0,false)} de la valeur`}));
  const pr=[...T].sort((a,b)=>b.payRev-a.payRev); pr._o={fmt:v=>pct(v,0,false),marks:[{v:50,l:'50 %'}]};
  expand('f-pr',pr,t=>({id:t.id,label:t.court,v:t.payRev,c:t.payRev>55?'var(--red)':'var(--bar)',tip:`<b>${t.nom}</b><br>Masse salariale ${md(t.pay)}<br>Revenus ${md(t.rev)}`}));
  const cb=T.filter(t=>t.cbt).sort((a,b)=>b.cbt-a.cbt);
  mount('#f-cbt',hbars(cb.map(t=>({id:t.id,label:t.court,v:t.cbt,c:t.cbt>301?'var(--red)':t.cbt>261?'var(--gold)':'var(--bar)',tip:`<b>${t.nom}</b><br>Masse CBT : ${md(t.cbt)}<br>Dépassement : ${md(t.cbt-241)}`})),{rowH:30,max:430,marks:[{v:241,l:'241'},{v:301,l:'301'}],fmt:v=>NF1.format(v)+' M$'}),9*30/560);
  // rendement
  const ow=T.filter(t=>t.buyY&&t.buyY<2026).sort((a,b)=>b.own-a.own);
  let oall=false; const otb=()=>{ $('#f-own').innerHTML=`<thead><tr><th class="l">Franchise</th><th>Achat</th><th>Prix payé</th><th>Valeur 2026</th><th>Multiple</th><th>Par an</th></tr></thead><tbody>${(oall?ow:ow.slice(0,12)).map(t=>`<tr data-id="${t.id}"><td class="l"><span class="tn">${lg(t.id,'s')}${t.nom}</span></td><td>${t.buyY}</td><td>${md(t.buyP)}</td><td>${md(t.cons)}</td><td>${NF1.format(t.ownX)}x</td><td class="${t.own>=0?'up':'dn'}"><b>${pct(t.own*100,1)}</b></td></tr>`).join('')}</tbody>`;
    if(!oall){ $('#f-own').parentElement.insertAdjacentHTML('afterend',`<button class="more" id="own-more">Afficher les ${ow.length}</button>`); $('#own-more').onclick=e=>{oall=true;e.target.remove();otb();}; } }; otb();
  // simulateur
  const sim=()=>{ const t=BY[$('#s-t').value], p=+$('#s-p').value/100, d=+$('#s-d').value/100, r=+$('#s-i').value/100, g=+$('#s-g').value/100, h=+$('#s-h').value;
    const price=t.cons*p, debt=price*d, eq=price-debt, exit=price*Math.pow(1+g,h), interest=debt*r*h, eqOut=exit-debt-interest; const irr=Math.pow(Math.max(eqOut,1)/eq,1/h)-1;
    $('#s-pv').textContent=md(price)+' ('+NF0.format(p*100)+' % du consensus)'; $('#s-dv').textContent=pct(d*100,0,false); $('#s-iv').textContent=pct(r*100,1,false); $('#s-gv').textContent=pct(g*100,1,false); $('#s-hv').textContent=h+' ans';
    $('#s-r').innerHTML=kpi('Fonds propres',big(eq))+kpi('Prix de revente',big(exit))+kpi('Plus-value nette',big(eqOut-eq),'',eqOut>eq?'up':'dn')+kpi('Rendement annuel',pct(irr*100,1,false),`${NF1.format(eqOut/eq)} fois la mise`,irr>=0?'up':'dn');
    $('#s-n').innerHTML=`La MLB plafonne la dette d'un club autour de 30 % de sa valeur. Intérêts simplifiés, sans remboursement ni flux d'exploitation. Référence : la valeur des Padres a été multipliée par ${NF1.format(3900/800)} entre 2012 et 2026.`; };
  ['s-t','s-p','s-d','s-i','s-g','s-h'].forEach(i=>$('#'+i).oninput=sim); $('#s-t').value='NYY'; sim();
  // plafond
  const cp=[...T].sort((a,b)=>b.pay-a.pay);

  $('#f-cap').insertAdjacentHTML('afterend',`<div class="note"><b>${T.filter(t=>t.pay>245.3).length} clubs</b> dépassaient le plafond proposé et <b>${T.filter(t=>t.pay<171.2).length} clubs</b> restaient sous le plancher. Le syndicat des joueurs rejette tout plafond.</div>`);
  const p3=[...T].sort((a,b)=>b.p2030-a.p2030); p3._o={};
  expand('f-p30',p3,t=>({id:t.id,label:t.court,v:t.p2030,v2:t.cons,c:t.c1,tip:`<b>${t.nom}</b><br>2026 : ${md(t.cons)}<br>2030 : ${md(t.p2030)}<br>Hypothèse : ${pct(t.g*100,1,false)} par an`}),24);
};

  el.innerHTML=head('Stades','La carte du <span class="serif">baseball</span>','Les 30 stades, les projets à plusieurs milliards et les quartiers immobiliers qui prolongent la valeur des clubs.')+
  `<div class="card map"><h3 class="ct">Où jouent les 30 franchises</h3><p class="cs">Taille du logo proportionnelle à la valeur. Toronto est le seul club hors des États-Unis.</p><div class="chart" id="st-m"></div></div>
  <div class="g g2 mt"><div class="card"><h3 class="ct">Les chantiers</h3><p class="cs">Coût estimé et part publique annoncée.</p><div class="rows">${X.projects.map(p=>`<div class="row" data-id="${p[0]}" style="grid-template-columns:34px 1fr auto;align-items:start">${lg(p[0])}<div class="nm">${p[1]} · ${p[2]}${p[3]?' · '+p[3]:''}<div style="font-weight:400;font-size:12.5px;color:var(--ink2)">${p[6]}</div></div><span class="vv">${p[4]?md(p[4]):'n.c.'}</span></div>`).join('')}</div></div>
  <div class="card"><h3 class="ct">Au-delà du stade</h3><p class="cs">Les quartiers détenus ou codéveloppés par les clubs.</p><div class="rows">${X.districts.map(d=>`<div class="row" data-id="${d[0]}" style="grid-template-columns:34px 1fr;align-items:start">${lg(d[0])}<div class="nm">${d[1]}<div style="font-weight:400;font-size:12.5px;color:var(--ink2)">${d[2]}</div></div></div>`).join('')}</div></div></div>
  <div class="card mt"><h3 class="ct">Les 30 stades</h3><p class="cs">Du plus ancien au plus récent.</p><div class="tw"><table class="t" id="st-t"><thead><tr><th class="l">Stade</th><th class="l">Franchise</th><th>Ouverture</th><th>Places</th><th>Affluence 2025</th><th>Remplissage</th></tr></thead><tbody>
  ${[...T].sort((a,b)=>a.opened-b.opened).map(t=>`<tr data-id="${t.id}"><td class="l"><b>${t.stade}</b></td><td class="l"><span class="tn">${lg(t.id,'s')}${t.court}</span></td><td>${t.opened}</td><td>${int(t.cap)}</td><td>${int(t.att)}</td><td>${t.id==='TB'?'<span data-t="Saison 2025 jouée à Steinbrenner Field (11 000 places) après les dégâts de l\'ouragan Milton">n.s.</span>':pct(Math.min(100,t.att/81/t.cap*100),0,false)}</td></tr>`).join('')}</tbody></table></div></div>`;
  const trs=$$('#st-t tbody tr'); trs.slice(12).forEach(r=>r.style.display='none'); $('#st-t').parentElement.insertAdjacentHTML('afterend','<button class="more" id="st-more">Afficher les 30</button>'); $('#st-more').onclick=e=>{ trs.forEach(r=>r.style.display=''); e.target.remove(); };
  const mx=byCons[0].cons; mount('#st-m',usmap({size:t=>22+22*Math.sqrt(t.cons/mx),sep:30}),.6);
};

/* ---------- DUEL ---------- */
PAGES.duel=el=>{
  const opt=v=>byCons.map(t=>`<option value="${t.id}" ${t.id===v?'selected':''}>${t.nom}</option>`).join('');
  el.innerHTML=head('Duel','Face à <span class="serif">face</span>','Deux franchises, quinze indicateurs, un vainqueur par ligne.')+
  `<div class="card"><div class="duel"><div class="dh" id="da"></div><div class="vs">vs</div><div class="dh" id="db"></div></div><div id="dr" class="mt"></div></div>
  <div class="card mt"><h3 class="ct">Valeur Forbes 2015-2026</h3><div class="chart" id="dl"></div></div>`;
  let A='NYY',B='LAD';
  const R=[['Valeur consensus','cons',md],['Forbes','fb',md],['CNBC','cn',md],['Sportico','sp',md],['Revenus 2025','rev',md],['EBITDA 2025','eb',md],['Multiple','mult',x1,1],['Dette (% valeur)','cnDebt',v=>pct(v,0,false),-1],['Croissance 1 an','chg',v=>pct(v,0)],['Croissance 2015-2026','cagr',v=>pct(v*100,1,false)],['Masse salariale','pay',md,0],['Victoires 2025','w',v=>v],['Titres','ws',v=>v],['Affluence 2025','att',int],['Indice Elite','elite',v=>NF1.format(v)]];
  const draw=()=>{ const a=BY[A],b=BY[B];
    $('#da').innerHTML=`${lg(A,'xl')}<select id="sa">${opt(A)}</select>`; $('#db').innerHTML=`${lg(B,'xl')}<select id="sb">${opt(B)}</select>`;
    $('#sa').onchange=e=>{A=e.target.value;draw();}; $('#sb').onchange=e=>{B=e.target.value;draw();};
    let wa=0,wb=0;
    $('#dr').innerHTML=R.map(([l,k,f,dir=1])=>{ const va=a[k],vb=b[k]; const mx=Math.max(Math.abs(va),Math.abs(vb))||1; const aw=dir===0?null:(dir*(va-vb)>0), bw=dir===0?null:(dir*(vb-va)>0); if(aw)wa++; if(bw)wb++;
      return `<div class="dr"><div class="a ${aw?'w':'ls'}">${f(va)}<i style="width:${Math.abs(va)/mx*45}%;background:${aw?a.c1:'var(--line2)'}"></i></div><div class="m">${l}</div><div class="b ${bw?'w':'ls'}"><i style="width:${Math.abs(vb)/mx*45}%;background:${bw?b.c1:'var(--line2)'}"></i>${f(vb)}</div></div>`; }).join('')+
      `<div class="dr" style="border-top:2px solid var(--ink)"><div class="a w" style="font-size:22px">${wa}</div><div class="m">Lignes gagnées</div><div class="b w" style="font-size:22px">${wb}</div></div>`;
    const fn=lines([a,b].map(t=>({name:t.court,c:t.id===B&&t.c1===a.c1?t.c2:t.c1,pts:YEARS.map((y,k)=>[y,t.hist[k]])})),{fmt:md,yfmt:v=>NF0.format(v/1000)+' Md$',endLabels:true});
    const box=$('#dl'); if(box._m){ box._m.fn=fn; box.innerHTML=fn(box.clientWidth,Math.round(box.clientWidth*.38)); } else mount(box,fn,.38); };
  draw();
};

/* ---------- MÉTHODE ---------- */
PAGES.methode=el=>{
  el.innerHTML=head('Méthode','Sources et <span class="serif">définitions</span>','')+`<div class="card prose">
  <h3>Trois sources de valorisation</h3>
  <p><b>Forbes</b> (20 mars 2026) : valeur d'entreprise (fonds propres et dette nette) incluant l'économie du stade mais pas la valeur de l'immobilier séparé ; revenus et résultat d'exploitation de la saison 2025.</p>
  <p><b>CNBC</b> (13 mars 2026) : valeur, revenus 2025, EBITDA 2025 et dette en pourcentage de la valeur, établis à partir d'entretiens avec des banquiers, des investisseurs et des dirigeants.</p>
  <p><b>Sportico</b> (18 mars 2026) : valeur incluant les actifs affiliés (immobilier, participations dans les chaînes régionales), d'où des montants plus élevés.</p>
  <h3>Valeur consensus</h3><p>Moyenne simple des trois estimations. Elle réduit l'effet des choix de méthode propres à chaque média. L'écart entre la plus haute et la plus basse estimation est exprimé en pourcentage du consensus.</p>
  <h3>Indice Elite</h3><p>Note sur 100 construite à partir des rangs centiles des 30 franchises : valeur consensus 40 %, revenus 2025 (moyenne Forbes et CNBC) 20 %, EBITDA 2025 CNBC 15 %, croissance sur un an (moyenne Forbes et Sportico) 10 %, sportif 15 % (70 % pourcentage de victoires 2025, 30 % titres de World Series). Les paliers sont fixés par la valeur : Titans à partir de 7 Md$, Élite à partir de 4 Md$, Prétendants à partir de 2,5 Md$, Challengers en dessous.</p>
  <h3>Indicateurs financiers</h3><p><b>Multiple</b> : valeur consensus divisée par les revenus 2025. <b>Dette</b> : pourcentage publié par CNBC appliqué à la valeur consensus. <b>Part salariale</b> : masse salariale finale 2025 (40 joueurs, primes comprises, source AP) sur revenus. <b>Rendement des propriétaires</b> : taux annuel entre le prix d'acquisition publié et la valeur consensus 2026, hors apports et distributions. <b>Projection 2030</b> : valeur 2026 prolongée à un taux égal à la moyenne de la croissance annuelle 2015-2026 et de la croissance de la dernière année, bornée entre 4 % et 14 %.</p>
  <h3>Historique</h3><p>Valeurs Forbes 2015 à 2026 (année de publication). Certaines valeurs anciennes supérieures à 1 Md$ sont arrondies à la centaine de millions dans les compilations publiques ; vingt valeurs de 2024 sont reconstituées à partir de la valeur 2025 et de la variation publiée.</p>
  <h3>Transactions</h3><p>Prix de contrôle publiés dans la presse économique et sportive. La vente des Angels à Stan Kroenke (4 Md$, septembre 2026) attend l'approbation des propriétaires. Les valeurs implicites des participations minoritaires sont celles rapportées au moment de l'opération.</p>
  <h3>Sportif et stades</h3><p>Bilans, séries éliminatoires et affluence 2025 : Baseball-Reference. Masse salariale au sens de la taxe de luxe : bureau du commissaire via CBS Sports et MLB Trade Rumors. Capacités et dates d'ouverture : données publiques des clubs.</p>
  <h3>Mise à jour</h3><p>Données arrêtées au ${X.asof}. Les classements Forbes, CNBC et Sportico 2027 paraîtront en mars 2027, après la négociation de la convention collective qui expire le 1er décembre 2026.</p>
  <h3>Identités visuelles</h3><p>Les logos appartiennent aux clubs et à la Major League Baseball. Ils sont reproduits ici à titre d'identification. Cette application est indépendante et n'est affiliée ni à la MLB ni aux clubs.</p></div>`;
};

/* ---------- Navigation ---------- */
const done={};
function go(p,push=true){
  p=String(p).split('/')[0];
  if(!PAGES[p]&&p!=='rapport') p='accueil';
  $$('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===p));
  const tb=$(`#tabs button[data-go="${p}"]`); if(tb) tb.scrollIntoView({inline:'center',block:'nearest'});
  if(!done[p]){ done[p]=1; (p==='rapport'?window.REPORT:PAGES[p])($('#p-'+p)); }
  else window.dispatchEvent(new Event('resize'));
  if(push&&p!=='rapport') history.replaceState(null,'','#'+p); scrollTo(0,0); closeF();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const f=e.target.closest('[data-id]'); if(f && !e.target.closest('select')){ fiche(f.dataset.id); }
});
$('#theme').onclick=()=>{ const r=document.documentElement; const d=r.dataset.theme==='dark'?'light':'dark'; r.dataset.theme=d; window.dispatchEvent(new Event('resize')); try{localStorage.setItem('mlbe-theme',d);}catch(e){} };
try{ const s=localStorage.getItem('mlbe-theme'); if(s) document.documentElement.dataset.theme=s; }catch(e){}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const hq=$('#hq'), hr=$('#hr'); let hsel=0, hlist=[];
const hrender=()=>{ const q=norm(hq.value.trim()); if(!q){ hr.style.display='none'; return; }
  hlist=byCons.filter(t=>norm([t.nom,t.court,t.ville,t.stade,t.owner,t.id].join(' ')).includes(q)).slice(0,7);
  hr.innerHTML=hlist.length?hlist.map((t,i)=>`<a data-id="${t.id}" class="${i===hsel?'on':''}">${lg(t.id,'s')}<span>${t.nom}<small>${t.stade} · ${t.owner.split(' (')[0]}</small></span><b>${md(t.cons)}</b></a>`).join(''):'<div style="padding:10px;color:var(--ink3);font-size:13px">Aucune franchise trouvée</div>';
  hr.style.display='block'; };
hq.oninput=()=>{ hsel=0; hrender(); };
hq.onkeydown=e=>{ if(e.key==='ArrowDown'){ hsel=Math.min(hsel+1,hlist.length-1); hrender(); e.preventDefault(); } else if(e.key==='ArrowUp'){ hsel=Math.max(hsel-1,0); hrender(); e.preventDefault(); } else if(e.key==='Enter'&&hlist[hsel]){ fiche(hlist[hsel].id); hq.value=''; hr.style.display='none'; hq.blur(); } else if(e.key==='Escape'){ hq.value=''; hr.style.display='none'; } };
document.addEventListener('click',e=>{ if(!e.target.closest('.hs')) hr.style.display='none'; else if(e.target.closest('.hres a')){ hq.value=''; hr.style.display='none'; } });
const toast=m=>{ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); };
$('#share').onclick=async()=>{ const d={title:document.title,text:'MLB Elite 2026 : la valorisation des 30 franchises de baseball',url:location.href};
  try{ if(navigator.share){ await navigator.share(d); return; } await navigator.clipboard.writeText(location.href); toast('Lien copié dans le presse-papiers'); }catch(e){ toast('Lien : '+location.href); } };
window.APP={go,fiche};
go((location.hash||'#accueil').slice(1),false);
})();

</script>
</body>
